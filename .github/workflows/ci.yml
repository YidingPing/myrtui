# myrtui CI（GitHub Actions）
#
# 矩阵只含 ubuntu：`myrtui/cli.py` 依赖 `fcntl`，且 tmux 无原生 Windows 版，
# 完整测试集在 Windows 跑不了；macOS 由 release.yml 的 verify job 在**打 tag 时**
# 跑一次（GitHub 的 macOS runner 分钟数按 10 倍计费，日常 PR 不值得付）。
#
# 全量测试串行约 5 分钟，`-n 4` 约 1 分钟；这里用 `-n 2` 保守取值，
# 避免公共 runner 2 核上把「shell 就绪」类用例挤成偶发失败
# （见 tests/README.md「并行下已知的易碎点」）。
name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]   # 打 tag 走 release.yml（含 macOS 验证 + 发布）
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install tmux
        run: |
          set -eux
          if ! command -v tmux >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tmux
          fi
          tmux -V

      - name: Install dependencies
        run: |
          set -eux
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Docs policy
        # 公开仓的文档边界（docs/ 白名单、无私网地址、无内部文档、sdist 白名单）
        # 见 tests/test_docs_policy.py 与 AGENTS.md；单独一步让失败原因一眼可见。
        run: python -m pytest tests/test_docs_policy.py -q

      - name: Test
        run: python -m pytest -n 2

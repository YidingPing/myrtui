# myrtui release（GitHub Actions）：打 tag → 验证 → 发 PyPI + GitHub Release
#
# 链路（文档见 docs/GITHUB-PUBLISH-PLAN.md §3.3）：
#   verify（macOS，唯一一次 macOS 测试）
#     → build（wheel + sdist）
#       → publish-pypi（Trusted Publishing，OIDC，无需 token）
#         → github-release（gh release create --generate-notes + 产物）
#
# 前置配置（只做一次，不在仓库里）：
#   1. PyPI → Your projects → Publishing → 添加 Trusted Publisher：
#      owner / repo / workflow 名必须是 `release.yml`、environment 填 `pypi`；
#   2. GitHub 仓库 → Settings → Environments → 新建 `pypi`；
#   3. 首次发布建议先手动跑到 TestPyPI 验证：把 publish-pypi 的
#      `repository-url: https://test.pypi.org/legacy/` 打开（并配套配置
#      TestPyPI 的 Trusted Publisher），装 `pipx install --index-url
#      https://test.pypi.org/simple/ myrtui` 确认可装，再关掉。
#
# 版本号以 pyproject.toml 为唯一真源；tag 必须与之一致（下面 build 步骤会校验）。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (macOS)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tmux
        run: |
          set -eux
          command -v tmux || brew install tmux
          tmux -V

      - name: Install dependencies
        run: |
          set -eux
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -n 2

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        run: |
          set -eux
          python - <<'PY'
          import os, pathlib, re
          version = re.search(
              r'^version\s*=\s*"([^"]+)"',
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8"),
              re.M,
          ).group(1)
          ref = os.environ.get("GITHUB_REF_NAME", "")
          print(f"pyproject version={version} ref={ref}")
          if ref.startswith("v") and ref[1:] != version:
              raise SystemExit(f"tag {ref} != pyproject version {version}")
          PY

      - name: Build wheel + sdist
        run: |
          set -eux
          python -m pip install -U build
          python -m build
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: publish (PyPI)
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/myrtui
    permissions:
      id-token: write   # Trusted Publishing（OIDC）
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        # 首次演练可临时加：
        #   with:
        #     repository-url: https://test.pypi.org/legacy/

  github-release:
    name: github release
    needs: [publish-pypi]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

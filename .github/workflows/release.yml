# myrtui release（GitHub Actions 专属）：打 tag → 验证 → 发 PyPI + GitHub Release
#
# 只在 GitHub 上跑（四个 job 都有 `github.server_url` 守卫）：本项目的日常 CI 在
# Gitea 自建 runner 上（见 `.gitea/workflows/ci.yml`），GitHub 只承担发布——
# PyPI 的 Trusted Publishing 走 OIDC，只支持 GitHub / GitLab / Google /
# ActiveState，Gitea 没有。
#
# 链路（内部设计记录见 docs-internal/docs/GITHUB-PUBLISH-PLAN.md §3.3）：
#   verify（Linux，发布闸门）
#     → build（wheel + sdist）
#       → publish-pypi（Trusted Publishing，OIDC，无需 token）
#         → github-release（gh release create --generate-notes + 产物）
#
# 为什么 verify 跑 ubuntu 而不是 macOS（0.5.2）：GitHub 托管 macOS runner 排队
# 拿不到名额时会 15 分钟后整体取消（0.5.1 出现四次），而 publish 卡在
# `needs: [verify, build]` 上——一个平台侧的排队问题就能堵死发布。macOS 面的
# 真实覆盖在 Gitea 自建 runner（一台 macOS，每次推送跑全量），GitHub 这一格
# 只是「再跑一遍」；把唯一的发布闸门绑在它上面不划算。macOS 保留为
# `workflow_dispatch` 的手动复核，不参与 publish 的 needs。
#
# 前置配置（只做一次，不在仓库里）：
#   1. PyPI → Your projects → Publishing → 添加 Trusted Publisher：
#      owner / repo / workflow 名必须是 `release.yml`、environment 填 `pypi`；
#   2. GitHub 仓库 → Settings → Environments → 新建 `pypi`；
#   3. TestPyPI 演练：另需一条**独立**的 TestPyPI Trusted Publisher（字段同上，
#      TestPyPI 是独立账号体系）。演练不靠改文件，而是靠 tag 名——见下方
#      publish 步骤里两条互斥的 `Publish` / `Publish (rehearsal)`：
#      tag 名含 `rc` 走 TestPyPI，其余走正式 PyPI。验收必须双源安装（TestPyPI
#      没有 textual 等依赖）：
#        pip install --index-url https://test.pypi.org/simple/ \
#                    --extra-index-url https://pypi.org/simple/ 'myrtui==X.Y.ZrcN'
#
# 版本号以 pyproject.toml 为唯一真源；tag 必须与之一致（下面 build 步骤会校验）。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# action 一律按 **commit SHA** 固定（2026-10-31 起），行尾注释留版本号方便升级：
# `publish` 那格持有 `id-token: write`，上游把 tag 移走或被投毒就等于用本仓的
# OIDC 身份往 PyPI 传包；而发版流程现在没有人在上传前看 diff（审批闸门已关），
# 所以这条是关掉闸门之后必须补的技术控制。升级时 SHA 与注释同改，别退回 `@v4`。

jobs:
  verify:
    name: verify (linux)
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Install tmux
        run: |
          set -eux
          command -v tmux || (sudo apt-get update && sudo apt-get install -y tmux)
          tmux -V

      - name: Install dependencies
        run: |
          set -eux
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -n 2

  # 0.5.4（#release-py310）：classifiers 声明 3.10–3.14，实际只有 3.12（build）与
  # 3.13（verify）跑过——3.10 这条**从未在任何 CI 上执行过**。这一格就是补它。
  #
  # 三条硬约束：
  #   1. **不进 `publish-pypi.needs`**：0.5.1 因为把唯一发布闸门绑在一个会排队的
  #      平台上被取消过四次（见文件头），3.10 红了要人看，不该自动堵发布——3.10
  #      的可用性变化是上游（textual / pillow）的事，与本仓库的一次提交无关；
  #   2. **只验「装得上 + 能启动」**，不跑全量：3.10 上全量套件的 flake 面积与时间
  #      都不值得；
  #   3. **不装 tmux**：这一格验的是安装面与 import，`pip install -e .` 与下面的
  #      用例都不需要 tmux——少一步就少一个与 3.10 无关的失败源。
  #
  # 冒烟选 `test_docs_policy.py` 而不是更轻的 `test_i18n.py`：它是全仓唯一在
  # 3.10 上走 `tomli` 兜底路径的用例（`try: import tomllib / except: import tomli`），
  # 而那正是 pyproject 里 `tomli>=2; python_version < '3.11'` 这一行存在的理由。
  # 用它，红点直接落在那条 3.10 专属依赖上，不用绕一圈才看出来。
  #
  # 预演：`workflow_dispatch` 就会跑这一格，而 `publish-pypi` / `github-release`
  # 都带 `startsWith(github.ref, 'refs/tags/')` 守卫——手动触发不会误发 PyPI。
  verify-py310:
    name: verify (python 3.10)
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"

      - name: Install
        run: |
          set -eux
          python -V
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Import and version
        run: |
          set -eux
          python -c "import myrtui, myrtui.cli; print(myrtui.__version__)"
          python -m myrtui.cli --version

      - name: Smoke test (tomli path)
        run: python -m pytest -q tests/test_docs_policy.py

  # 手动复核用：macOS 面不参与发布闸门（理由见文件头）。tag 推送时不会跑，
  # 只有 workflow_dispatch 才跑——它不给 publish 提供任何前置条件。
  verify-macos:
    name: verify (macOS, manual)
    if: github.server_url == 'https://github.com' && github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Install tmux
        run: |
          set -eux
          command -v tmux || brew install tmux
          tmux -V

      - name: Install dependencies
        run: |
          set -eux
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -n 2

  build:
    name: build
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        run: |
          set -eux
          python - <<'PY'
          import os, pathlib, re
          version = re.search(
              r'^version\s*=\s*"([^"]+)"',
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8"),
              re.M,
          ).group(1)
          ref = os.environ.get("GITHUB_REF_NAME", "")
          print(f"pyproject version={version} ref={ref}")
          if ref.startswith("v") and ref[1:] != version:
              raise SystemExit(f"tag {ref} != pyproject version {version}")
          PY

      - name: Build wheel + sdist
        run: |
          set -eux
          python -m pip install -U build
          python -m build
          ls -l dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: publish (PyPI)
    needs: [verify, build]
    if: github.server_url == 'https://github.com' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/myrtui
    permissions:
      id-token: write   # Trusted Publishing（OIDC）
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      # tag 名决定发到哪个索引：含 `rc` → TestPyPI，其余 → 正式 PyPI。
      # 刻意用条件而不是「改注释再 revert」——后者依赖人记得改回来，忘了就会把
      # 正式版本发到 TestPyPI 上（见 docs-internal 的 0.5.0 发布方案 §3-D）。
      - name: Publish
        if: ${{ !contains(github.ref_name, 'rc') }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

      - name: Publish (rehearsal)
        if: ${{ contains(github.ref_name, 'rc') }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  github-release:
    name: github release
    needs: [publish-pypi]
    if: github.server_url == 'https://github.com' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

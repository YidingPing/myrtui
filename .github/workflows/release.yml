# myrtui release（GitHub Actions 专属）：打 tag → 验证 → 发 PyPI + GitHub Release
#
# 只在 GitHub 上跑（四个 job 都有 `github.server_url` 守卫）：本项目的日常 CI 在
# Gitea 自建 runner 上（见 `.gitea/workflows/ci.yml`），GitHub 只承担发布——
# PyPI 的 Trusted Publishing 走 OIDC，只支持 GitHub / GitLab / Google /
# ActiveState，Gitea 没有。
#
# 链路（内部设计记录见 docs-internal/docs/GITHUB-PUBLISH-PLAN.md §3.3）：
#   verify（macOS，唯一一次 macOS 测试）
#     → build（wheel + sdist）
#       → publish-pypi（Trusted Publishing，OIDC，无需 token）
#         → github-release（gh release create --generate-notes + 产物）
#
# 前置配置（只做一次，不在仓库里）：
#   1. PyPI → Your projects → Publishing → 添加 Trusted Publisher：
#      owner / repo / workflow 名必须是 `release.yml`、environment 填 `pypi`；
#   2. GitHub 仓库 → Settings → Environments → 新建 `pypi`；
#   3. TestPyPI 演练：另需一条**独立**的 TestPyPI Trusted Publisher（字段同上，
#      TestPyPI 是独立账号体系）。演练不靠改文件，而是靠 tag 名——见下方
#      publish 步骤里两条互斥的 `Publish` / `Publish (rehearsal)`：
#      tag 名含 `rc` 走 TestPyPI，其余走正式 PyPI。验收必须双源安装（TestPyPI
#      没有 textual 等依赖）：
#        pip install --index-url https://test.pypi.org/simple/ \
#                    --extra-index-url https://pypi.org/simple/ 'myrtui==X.Y.ZrcN'
#
# 版本号以 pyproject.toml 为唯一真源；tag 必须与之一致（下面 build 步骤会校验）。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (macOS)
    if: github.server_url == 'https://github.com'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tmux
        run: |
          set -eux
          command -v tmux || brew install tmux
          tmux -V

      - name: Install dependencies
        run: |
          set -eux
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -n 2

  build:
    name: build
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        run: |
          set -eux
          python - <<'PY'
          import os, pathlib, re
          version = re.search(
              r'^version\s*=\s*"([^"]+)"',
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8"),
              re.M,
          ).group(1)
          ref = os.environ.get("GITHUB_REF_NAME", "")
          print(f"pyproject version={version} ref={ref}")
          if ref.startswith("v") and ref[1:] != version:
              raise SystemExit(f"tag {ref} != pyproject version {version}")
          PY

      - name: Build wheel + sdist
        run: |
          set -eux
          python -m pip install -U build
          python -m build
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: publish (PyPI)
    needs: [verify, build]
    if: github.server_url == 'https://github.com' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/myrtui
    permissions:
      id-token: write   # Trusted Publishing（OIDC）
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # tag 名决定发到哪个索引：含 `rc` → TestPyPI，其余 → 正式 PyPI。
      # 刻意用条件而不是「改注释再 revert」——后者依赖人记得改回来，忘了就会把
      # 正式版本发到 TestPyPI 上（见 docs-internal 的 0.5.0 发布方案 §3-D）。
      - name: Publish
        if: ${{ !contains(github.ref_name, 'rc') }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish (rehearsal)
        if: ${{ contains(github.ref_name, 'rc') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  github-release:
    name: github release
    needs: [publish-pypi]
    if: github.server_url == 'https://github.com' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
